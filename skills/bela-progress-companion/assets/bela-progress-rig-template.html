    window.__timelines = window.__timelines || {};

    const FPS = 30;
    const LAST_FRAME = 149;
    const END_TIME = LAST_FRAME / FPS;
    const SOURCE_TO_SCREEN = 0.155 * 0.82;
    const atFrame = (frame) => frame / FPS;
    const sourceUnits = (screenPixels) => screenPixels / SOURCE_TO_SCREEN;
    const tl = gsap.timeline({ paused: true });

    // Smooth non-constant travel with a strictly positive derivative.
    gsap.registerEase(
      "inertiaDotTravel",
      (progress) =>
        progress
        - 0.012 * Math.sin(Math.PI * 2 * progress)
        - 0.005 * Math.sin(Math.PI * 4 * progress)
        - 0.0025 * Math.sin(Math.PI * 8 * progress)
    );

    const addSvgSegments = (selector, pivot, keys, properties) => {
      const initial = { svgOrigin: pivot };
      for (const [property, valueIndex, convert] of properties) {
        initial[property] = convert(keys[0][valueIndex]);
      }
      tl.set(selector, initial, 0);

      for (let i = 1; i < keys.length; i += 1) {
        const values = { duration: atFrame(keys[i][0] - keys[i - 1][0]), ease: "sine.inOut" };
        for (const [property, valueIndex, convert] of properties) {
          values[property] = convert(keys[i][valueIndex]);
        }
        tl.to(selector, values, atFrame(keys[i - 1][0]));
      }
    };

    tl.fromTo(
      "#ride-root",
      { x: 92 },
      { x: 812, duration: END_TIME, ease: "inertiaDotTravel", immediateRender: true },
      0
    );

    tl.fromTo(
      "#progress-complete",
      { scaleX: 92 / 864 },
      { scaleX: 1, duration: END_TIME, ease: "inertiaDotTravel", immediateRender: true },
      0
